<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>🤣 LEMPAR BAYU 🤣</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  padding:0;
  width:100%;
  min-height:100%;
}

body{
  font-family:Arial,sans-serif;
  background:#080808;
  color:white;
  text-align:center;
  overflow-x:hidden;
}

#game{
  width:100%;
  min-height:100vh;
  padding:12px 10px 25px;
  background:
    radial-gradient(circle at top,#642276,#160d1d 55%,#050505);
}

h1{
  margin:5px 0;
  font-size:25px;
}

.subtitle{
  margin:0 0 5px;
  color:#ccc;
  font-size:13px;
}

#score{
  font-size:21px;
  font-weight:bold;
  margin:7px 0;
}

#message{
  min-height:24px;
  font-size:15px;
  font-weight:bold;
  margin-bottom:7px;
}

/* ARENA */

#arena{
  position:relative;
  width:100%;
  max-width:500px;
  height:min(48vh,430px);
  min-height:270px;
  margin:0 auto;

  border:3px solid white;
  border-radius:22px;

  overflow:hidden;

  background:
    radial-gradient(circle at 50% 35%,#482053,#100b14 70%);

  box-shadow:0 0 25px #a532c9;
}

/* TARGET */

#target{
  position:absolute;

  left:50%;
  top:50%;

  width:150px;
  height:150px;

  transform:translate(-50%,-50%);

  border-radius:50%;
  overflow:hidden;

  border:5px solid white;

  background:#222;

  box-shadow:0 0 25px #ff3df2;

  z-index:3;
}

#targetImage{
  width:100%;
  height:100%;

  display:block;

  object-fit:cover;
  object-position:center;
}

/* TARGET KENA */

#target.hit{
  animation:hit .3s;
}

@keyframes hit{

  0%{
    transform:translate(-50%,-50%) scale(1) rotate(0);
  }

  30%{
    transform:translate(-50%,-50%) scale(.85) rotate(-8deg);
  }

  60%{
    transform:translate(-50%,-50%) scale(1.1) rotate(8deg);
  }

  100%{
    transform:translate(-50%,-50%) scale(1) rotate(0);
  }

}

/* BARANG */

#items{
  width:100%;
  max-width:500px;

  margin:10px auto 0;

  display:grid;

  grid-template-columns:repeat(4,1fr);

  gap:6px;
}

.item{
  min-width:0;

  border:2px solid #555;
  border-radius:12px;

  background:#191919;
  color:white;

  padding:8px 2px;

  font-size:26px;

  cursor:pointer;

  touch-action:manipulation;
}

.item span{
  display:block;

  margin-top:2px;

  font-size:10px;

  color:#ccc;
}

.item:active{
  transform:scale(.88);
  background:#461653;
}

/* TOMBOL MULAI */

#start{
  position:relative;

  z-index:9999;

  display:block;

  width:min(320px,90%);

  margin:12px auto 20px;

  padding:15px 20px;

  border:0;

  border-radius:15px;

  background:white;
  color:#111;

  font-size:18px;
  font-weight:bold;

  box-shadow:0 5px 18px rgba(0,0,0,.5);

  cursor:pointer;

  touch-action:manipulation;
}

#start:active{
  transform:scale(.95);
}

/* BENDA YANG DILEMPAR */

.projectile{
  position:absolute;

  z-index:20;

  pointer-events:none;

  font-size:38px;

  transition:
    left .4s cubic-bezier(.2,.8,.2,1),
    top .4s cubic-bezier(.2,.8,.2,1),
    transform .4s;
}

/* EFEK TEKS */

.pop{
  position:absolute;

  z-index:30;

  pointer-events:none;

  font-size:25px;
  font-weight:bold;

  animation:pop .6s forwards;
}

@keyframes pop{

  0%{
    opacity:1;
    transform:scale(.5) translateY(0);
  }

  100%{
    opacity:0;
    transform:scale(1.5) translateY(-50px);
  }

}

/* LAYAR HP KECIL */

@media(max-height:650px){

  #game{
    padding-top:7px;
  }

  h1{
    font-size:21px;
  }

  .subtitle{
    font-size:11px;
  }

  #score{
    font-size:18px;
    margin:4px;
  }

  #message{
    font-size:13px;
    min-height:20px;
  }

  #arena{
    height:38vh;
    min-height:220px;
  }

  #target{
    width:125px;
    height:125px;
  }

  .item{
    padding:5px 2px;
    font-size:22px;
  }

  .item span{
    font-size:9px;
  }

  #start{
    margin-top:9px;
    padding:12px;
    font-size:16px;
  }

}

/* HP SANGAT KECIL */

@media(max-width:360px){

  #arena{
    height:35vh;
    min-height:200px;
  }

  #target{
    width:110px;
    height:110px;
  }

  #items{
    gap:4px;
  }

  .item{
    font-size:20px;
  }

  #start{
    width:95%;
  }

}
</style>
</head>

<body>

<div id="game">

  <h1>🤣 LEMPAR BAYU 🤣</h1>

  <p class="subtitle">
    Pilih benda lalu lempar ke target!
  </p>

  <div id="score">
    Skor: 0
  </div>

  <div id="message">
    Tekan MULAI GAME dulu bro!
  </div>


  <!-- ARENA -->

  <div id="arena">

    <div id="target">

      <img
        id="targetImage"
        src="IMG-20260503-WA0002.jpg"
        alt="Bayu">

    </div>

  </div>


  <!-- BARANG -->

  <div id="items">

    <button class="item"
      onclick="throwItem('🩴',10,'PLAK!')">
      🩴
      <span>Sendal</span>
    </button>

    <button class="item"
      onclick="throwItem('🥒',15,'DUK!')">
      🥒
      <span>Timun</span>
    </button>

    <button class="item"
      onclick="throwItem('🍆',15,'BUK!')">
      🍆
      <span>Terong</span>
    </button>

    <button class="item"
      onclick="throwItem('👟',20,'BRAK!')">
      👟
      <span>Sepatu</span>
    </button>

    <button class="item"
      onclick="throwItem('❤️',25,'LOVE!')">
      ❤️
      <span>Hati</span>
    </button>

    <button class="item"
      onclick="throwItem('⚽',30,'BOOM!')">
      ⚽
      <span>Bola</span>
    </button>

    <button class="item"
      onclick="throwItem('💣',50,'DUARR!')">
      💣
      <span>Bom</span>
    </button>

    <button class="item"
      onclick="throwItem('🍅',10,'PLOK!')">
      🍅
      <span>Tomat</span>
    </button>

  </div>


  <!-- TOMBOL -->

  <button id="start" onclick="startGame()">
    ▶️ MULAI GAME
  </button>

</div>


<script>

/* =========================
   DATA GAME
========================= */

let score = 0;
let playing = false;
let audioCtx = null;


/* =========================
   FOTO
========================= */

const photos = [

  "IMG-20260503-WA0002.jpg",

  "IMG-20260804-WA0102.jpg",

  "IMG-20260916-WA0088.jpg",

  "IMG_20260825_195458.jpg",

  "IMG_20260911_121045.jpg",

  "IMG_20260911_121113.jpg",

  "IMG_20260911_121132.jpg",

  "IMG_20260911_122745.jpg",

  "IMG_20260924_003803.jpg"

];

let photoIndex = 0;


/* GANTI FOTO SETIAP 15 DETIK */

setInterval(function(){

  photoIndex =
    (photoIndex + 1) % photos.length;

  document.getElementById(
    "targetImage"
  ).src = photos[photoIndex];

},15000);


/* =========================
   ELEMENT
========================= */

const arena =
  document.getElementById("arena");

const target =
  document.getElementById("target");

const message =
  document.getElementById("message");

const scoreText =
  document.getElementById("score");


/* =========================
   AUDIO
========================= */

function initAudio(){

  if(!audioCtx){

    audioCtx =
      new(
        window.AudioContext ||
        window.webkitAudioContext
      )();

  }

  if(audioCtx.state === "suspended"){

    audioCtx.resume();

  }

}


function sound(type){

  initAudio();

  const osc =
    audioCtx.createOscillator();

  const gain =
    audioCtx.createGain();

  osc.connect(gain);
  gain.connect(audioCtx.destination);

  let freq = 300;

  if(type === "hit"){
    freq = 120;
  }

  if(type === "bom"){
    freq = 70;
  }

  if(type === "love"){
    freq = 700;
  }

  osc.frequency.value = freq;

  osc.type =
    type === "bom"
    ? "sawtooth"
    : "square";

  gain.gain.setValueAtTime(
    .15,
    audioCtx.currentTime
  );

  gain.gain.exponentialRampToValueAtTime(
    .001,
    audioCtx.currentTime + .25
  );

  osc.start();

  osc.stop(
    audioCtx.currentTime + .25
  );

}


/* =========================
   MULAI GAME
========================= */

function startGame(){

  initAudio();

  score = 0;

  playing = true;

  scoreText.textContent =
    "Skor: 0";

  message.textContent =
    "Pilih benda buat dilempar! 🎯";

  sound("love");

}


/* =========================
   LEMPAR BENDA
========================= */

function throwItem(
  emoji,
  points,
  text
){

  if(!playing){

    message.textContent =
      "Tekan MULAI GAME dulu bro 😭";

    return;

  }


  const projectile =
    document.createElement("div");

  projectile.className =
    "projectile";

  projectile.textContent =
    emoji;

  arena.appendChild(projectile);


  /* POSISI AWAL */

  const startX =
    Math.random() *
    Math.max(
      20,
      arena.clientWidth - 60
    ) + 20;

  const startY =
    arena.clientHeight - 50;


  projectile.style.left =
    startX + "px";

  projectile.style.top =
    startY + "px";


  /* POSISI TARGET */

  const targetX =
    target.offsetLeft +
    target.offsetWidth / 2 -
    19;

  const targetY =
    target.offsetTop +
    target.offsetHeight / 2 -
    19;


  /* GERAK */

  requestAnimationFrame(function(){

    requestAnimationFrame(function(){

      projectile.style.left =
        targetX + "px";

      projectile.style.top =
        targetY + "px";

      projectile.style.transform =
        "rotate(720deg) scale(1.2)";

    });

  });


  /* SAAT KENA */

  setTimeout(function(){

    if(projectile.parentNode){

      projectile.remove();

    }


    score += points;

    scoreText.textContent =
      "Skor: " + score;

    message.textContent =
      text + " +" + points;


    /* GOYANG TARGET */

    target.classList.remove("hit");

    void target.offsetWidth;

    target.classList.add("hit");


    /* SUARA */

    if(emoji === "💣"){

      sound("bom");

      explosion();

    }else{

      sound(
        emoji === "❤️"
        ? "love"
        : "hit"
      );

      showPop(text);

    }

  },450);

}


/* =========================
   EFEK TEKS
========================= */

function showPop(text){

  const pop =
    document.createElement("div");

  pop.className =
    "pop";

  pop.textContent =
    text;

  pop.style.left =
    Math.max(
      10,
      arena.clientWidth / 2 - 35
    ) + "px";

  pop.style.top =
    Math.max(
      10,
      arena.clientHeight / 2 - 20
    ) + "px";

  arena.appendChild(pop);

  setTimeout(function(){

    pop.remove();

  },600);

}


/* =========================
   BOM
========================= */

function explosion(){

  for(let i = 0; i < 12; i++){

    const e =
      document.createElement("div");

    e.className =
      "pop";

    e.textContent =
      "💥";

    e.style.left =
      (
        arena.clientWidth / 2 +
        (Math.random() - .5) * 180
      ) + "px";

    e.style.top =
      (
        arena.clientHeight / 2 +
        (Math.random() - .5) * 130
      ) + "px";

    arena.appendChild(e);

    setTimeout(function(){

      e.remove();

    },700);

  }

  message.textContent =
    "💣 DUARRRR!!! +50";

}

</script>

</body>
  </html>
